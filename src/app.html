<!doctype html>
<html lang="en-GB">
	<head>
		<meta charset="utf-8" />
		<link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png" />
		<link rel="manifest" href="/images/site.webmanifest" />
		<meta name="google-adsense-account" content="ca-pub-3090319297502193" />
		<script
			async
			src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3090319297502193"
			crossorigin="anonymous"
		></script>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%
		<!-- Fallback head tags if %sveltekit.head% fails to render a page-specific title/description (e.g. a fatal error before svelte:head runs); the first <title>/<meta name="description"> in document order wins, so these never override a normal page's own tags. -->
		<title>Reading Weather — Forecasts &amp; Observations for Reading, UK</title>
		<meta name="description" content="Weather forecasts, observations, and records for Reading, Berkshire, UK. Updated regularly with local conditions and seasonal outlooks." />
	</head>
	<body data-sveltekit-preload-data="hover">
		<div class="page-container">%sveltekit.body%</div>
	</body>
</html>
